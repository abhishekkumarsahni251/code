<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makhu Makhana</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf0;
      color: #23452f;
      text-align: center;
    }
    header {
      background: #205b3b;
      color: white;
      padding: 22px;
    }
    header h1 {
      margin: 0;
      font-size: 36px;
    }
    .hero {
      padding: 55px 20px;
    }
    .hero h2 {
      font-size: 38px;
    }
    .hero p {
      font-size: 18px;
    }
    .button {
      display: inline-block;
      background: #205b3b;
      color: white;
      padding: 13px 25px;
      border-radius: 25px;
      text-decoration: none;
    }
    .product {
      background: white;
      padding: 25px;
      margin: 20px auto;
      max-width: 300px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0001;
    }
    .makhana {
      font-size: 75px;
    }
    footer {
      background: #205b3b;
      color: white;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>MAKHU</h1>
    <p>Pure Makhana • Healthy Life</p>
  </header>

  <section class="hero">
    <h2>Pure Makhana</h2>
    <p>Crunchy, tasty and made for your snack time.</p>
    <a class="button" href="#products">Shop Now</a>
  </section>

  <section id="products">
    <h2>Our Products</h2>

    <div class="product">
      <div class="makhana">🥣</div>
      <h3>Plain Makhana</h3>
      <p>Pack: 100 g</p>
      <h3>₹120</h3>
      <a class="button" href="#contact">Order Now</a>
    </div>
  </section>

  <section id="contact">
    <h2>Contact Makhu</h2>
    <p>Contact us to place your order.</p>
  </section>

  <footer>
    <p>© 2026 Makhu Makhana</p>
  </footer>

</body>
</html>
